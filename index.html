    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'adm-default-app';
        let firebaseConfig = {
            apiKey: "AIzaSyDB3NxgmIvS555kXhbc9BKpxtl4hFZF1RY",
            authDomain: "absensi-21722.firebaseapp.com",
            databaseURL: "https://absensi-21722-default-rtdb.firebaseio.com",
            projectId: "absensi-21722",
            storageBucket: "absensi-21722.firebasestorage.app",
            messagingSenderId: "395396188500",
            appId: "1:395396188500:web:024f2bbe2f599e220b20c1"
        };
        if (typeof __firebase_config !== 'undefined') {
            try { firebaseConfig = JSON.parse(__firebase_config); } catch (e) { }
        }

        let firestoreDb = null;
        window.isCloudReady = false;

        async function initFirebase() {
            if (!firebaseConfig.apiKey) {
                console.warn("Konfigurasi Cloud tidak ditemukan, mode lokal.");
                return;
            }
            try {
                const app = initializeApp(firebaseConfig);
                firestoreDb = getFirestore(app);
                const auth = getAuth(app);

                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                window.isCloudReady = true;
            } catch (error) {
                console.error("Gagal Firebase:", error);
            }
        }

        window.loadStateFromCloud = async function () {
            if (!window.isCloudReady || !firestoreDb) return null;
            try {
                const docRef = doc(firestoreDb, 'artifacts', appId, 'public', 'data', 'appState', 'v4');
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) return docSnap.data();
            } catch (e) {
                console.error("Gagal muat Cloud:", e);
            }
            return null;
        };

        window.saveStateToCloud = async function (stateData) {
            if (!window.isCloudReady || !firestoreDb) return false;
            try {
                const parsed = JSON.parse(JSON.stringify(stateData));
                const docRef = doc(firestoreDb, 'artifacts', appId, 'public', 'data', 'appState', 'v4');
                await setDoc(docRef, parsed);
                return true;
            } catch (e) {
                console.error("Gagal simpan Cloud:", e);
                return false;
            }
        };

        document.addEventListener('DOMContentLoaded', async () => {
            await initFirebase();
            if (window.initApp) window.initApp();
        });
    </script>

        async function loadState() {
            let localUser = null;
            try {
                const savedState = localStorage.getItem('adm_state_v4');
                if (savedState) {
                    const parsed = JSON.parse(savedState);
                    localUser = parsed.currentUser;
                }
            } catch (e) { }

            let loadedFromCloud = false;
            if (window.loadStateFromCloud) {
                const cloudState = await window.loadStateFromCloud();
                if (cloudState) {
                    state = { ...state, ...cloudState };
                    state.currentUser = localUser;
                    loadedFromCloud = true;
                    try { localStorage.setItem('adm_state_v4', JSON.stringify(state)); } catch (e) { }
                }
            }

            if (!loadedFromCloud) {
                try {
                    const savedState = localStorage.getItem('adm_state_v4');
                    if (savedState) state = { ...state, ...JSON.parse(savedState) };
                } catch (e) {
                    localStorage.removeItem('adm_state_v4');
                }
            }
            syncFavicon();
        }

        function saveState() {
            try {
                localStorage.setItem('adm_state_v4', JSON.stringify(state));
            } catch (e) {
                showAlert('Penyimpanan Penuh', 'Kapasitas penyimpanan penuh. Bersihkan log aktivitas.', 'error');
            }

            if (window.saveStateToCloud) {
                const cloudData = { ...state };
                delete cloudData.currentUser;
                window.saveStateToCloud(cloudData);
            }
        }

        function addLog(action) {
            const now = new Date();
            state.logAktivitas.unshift({
                date: now.toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }) + ' WIB',
                action: action
            });
            if (state.logAktivitas.length > 100) state.logAktivitas.pop();
            saveState();
        }

        function showAlert(title, text, icon) {
            return Swal.fire({

                confirmButtonColor: '#0d9488',
                customClass: { confirmButton: 'rounded-lg px-6 py-2.5 font-semibold shadow-md' }

        }

            const favicon = document.getElementById('dynamic-favicon');
            if (favicon) favicon.href = state.profil.logo || 'https://placehold.co/100x100/0d9488/ffffff?text=ADM';
        }

        function compressImage(file, maxSize, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;

                    if (width > height) {
                        if (width > maxSize) { height = Math.round(height * maxSize / width); width = maxSize; }
                    } else {
                        if (height > maxSize) { width = Math.round(width * maxSize / height); height = maxSize; }
                    }

                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/webp', 0.8));
                };
            };
        }

        function isLibur(dateObj = new Date()) {
            if (dateObj.getDay() === 0) return 'Hari Minggu';
            const YYYY = dateObj.getFullYear();
            const MM = String(dateObj.getMonth() + 1).padStart(2, '0');
            const DD = String(dateObj.getDate()).padStart(2, '0');
            const formattedDate = `${YYYY}-${MM}-${DD}`;

            const libur = liburNasional.find(l => l.date === formattedDate);
            if (libur) return libur.name;
            return false;
        }

        function formatDateID(dateStr) {
            if (!dateStr) return '-';
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            return new Date(dateStr).toLocaleDateString('id-ID', options);
        }

        function checkAutoAlpa() {
            if (state.dataGuru.length === 0) return;
            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];

            if (!state.pengaturan.batasAkhir) return;

            const batasSplit = state.pengaturan.batasAkhir.split(':');
            const waktuBatas = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parseInt(batasSplit[0]), parseInt(batasSplit[1]), 0);

            if (now > waktuBatas) {
                const liburStatus = isLibur(now);
                if (!liburStatus) {
                    let modified = false;
                    state.dataGuru.forEach(guru => {
                        const hasAbsenToday = state.rekapAbsen.find(r => r.nuptk === guru.nuptk && r.date === todayStr);
                        if (!hasAbsenToday) {
                            state.rekapAbsen.push({
                                id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                                nuptk: guru.nuptk,
                                date: todayStr,
                                time: '-',
                                status: 'Alpa',
                                tunjangan: '-',
                                note: 'Otomatis oleh Sistem'
                            });
                            addLog(`Sistem menandai Alpa untuk ${guru.nama}`);
                            modified = true;
                        }
                    });
                    if (modified) saveState();
                }
            }
        }

        function switchLoginTab(type) {
            const formGuru = document.getElementById('form-guru');
            const formAdmin = document.getElementById('form-admin');
            const tabGuru = document.getElementById('tab-guru');
            const tabAdmin = document.getElementById('tab-admin');

            if (type === 'guru') {
                formGuru.classList.remove('hidden'); formAdmin.classList.add('hidden');
                tabGuru.className = "w-1/2 py-2.5 text-center font-bold text-brand-700 bg-white shadow-sm rounded-md transition-all";
                tabAdmin.className = "w-1/2 py-2.5 text-center font-semibold text-slate-500 hover:text-slate-700 transition-all rounded-md";
            } else {
                formGuru.classList.add('hidden'); formAdmin.classList.remove('hidden');
                tabAdmin.className = "w-1/2 py-2.5 text-center font-bold text-slate-800 bg-white shadow-sm rounded-md transition-all";
                tabGuru.className = "w-1/2 py-2.5 text-center font-semibold text-slate-500 hover:text-slate-700 transition-all rounded-md";
            }
        }

        function togglePass(id) {
            const input = document.getElementById(id);
            if (input) input.type = input.type === 'password' ? 'text' : 'password';
        }

        async function processLogin(role) {
            Swal.fire({
                title: 'Memverifikasi...',
                html: 'Menyinkronkan kredensial dengan server...',
                allowEscapeKey: false,
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            await loadState();

            if (role === 'admin') {
                const nsm = document.getElementById('login-nsm').value.trim();
                const pass = document.getElementById('login-pass-admin').value;

                if (!state.adminAuth.nsm) {
                    Swal.close();
                    return showAlert('Akun Belum Ada', 'Belum ada akun admin terdaftar. Silahkan buat akun admin terlebih dahulu.', 'warning');
                }

                if (nsm === state.adminAuth.nsm && pass === state.adminAuth.password) {
                    state.currentUser = { role: 'admin', id: nsm, name: state.profil.nama || 'Admin Madrasah' };
                    saveState();
                    addLog('Admin Login');
                    checkAutoAlpa();
                    Swal.close();
                    renderLayout();
                } else {
                    Swal.close();
                    showAlert('Gagal Masuk', 'NSM atau Password Admin salah!', 'error');
                }
            } else {
                const nuptk = document.getElementById('login-nuptk').value.trim();
                const pass = document.getElementById('login-pass-guru').value;
                const guru = state.dataGuru.find(g => g.nuptk === nuptk && g.password === pass);

                activeBtn.classList.add('bg-slate-800', 'text-white', 'border-brand-400');
                activeBtn.classList.remove('text-slate-400', 'border-transparent');
            }

            document.querySelectorAll('.mobile-bottom-nav button').forEach(btn => {
                btn.classList.remove('active-nav');
            });
            const activeMobileBtn = document.getElementById(`mnav-${view}`);
            if (activeMobileBtn) {
                activeMobileBtn.classList.add('active-nav');

                if (view === 'dashboard') renderDashboard(contentDiv);

                else if (view === 'guru') renderDataGuru(contentDiv);
                else if (view === 'rekap') renderRekap(contentDiv);

        async function downloadTemplate() {
            try {
                // Menggunakan ExcelJS untuk mendukung pembuatan Data Validation secara native
                const workbook = new ExcelJS.Workbook();
                const worksheet = workbook.addWorksheet("Template Guru");

                // Konfigurasi lebar dan judul kolom
                worksheet.columns = [
                    { header: "NUPTK/PEG ID", key: "nuptk", width: 25 },
                    { header: "Nama Guru", key: "nama", width: 30 },
                    { header: "Tempat Lahir", key: "tmLahir", width: 18 },
                    { header: "Tanggal Lahir (YYYY-MM-DD)", key: "tglLahir", width: 30 },
                    { header: "Jabatan", key: "jabatan", width: 25 },
                    { header: "Pendidikan", key: "pendidikan", width: 25 },
                    { header: "Password", key: "password", width: 20 }
                ];

                // Styling Header (Baris 1)
                const headerRow = worksheet.getRow(1);
                headerRow.height = 24; // Menambahkan tinggi baris 18px untuk header
                headerRow.eachCell((cell) => {
                    cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
                    cell.fill = {
                        type: 'pattern',
                        pattern: 'solid',
                        fgColor: { argb: 'FF0D9488' } // Warna latar (hijau toska/teal sesuai tema aplikasi)
                    };
                    cell.alignment = { vertical: 'middle', horizontal: 'center' };
                    cell.border = {
                        top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' }
                    };
                    cell.protection = { locked: true }; // Kunci baris pertama
                });

                // Menyiapkan 30 baris kosong dengan styling border dan aturan validasi
                for (let i = 2; i <= 31; i++) {
                    const row = worksheet.getRow(i);
                    row.height = 18;

                    // Membuat border (Garis pinggir)
                    for (let j = 1; j <= 7; j++) {
                        const cell = row.getCell(j);
                        cell.border = {
                            top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' }
                        };
                        cell.protection = { locked: false }; // Buka kunci agar data bisa diketik oleh user
                    }

                    // Injeksi Validasi Dropdown untuk Kolom Pendidikan (Kolom ke-6 / F)
                    row.getCell(6).dataValidation = {
                        type: 'list',
                        allowBlank: true,
                        showInputMessage: true,
                        showErrorMessage: true,
                        errorTitle: 'Input Tidak Valid',
                        error: 'Silakan pilih tingkat pendidikan dari daftar yang muncul pada dropdown.',
                        formulae: ['"SMA / MA / SMK,D1 (Diploma),D2 (Diploma),D3 (Diploma),D4 (Diploma) / S1 (Sarjana),S2 (Magister),S3 (Doktor)"']
                    };
                }

                // Aktifkan perlindungan Worksheet dengan password (contoh password: 'adm')
                await worksheet.protect('adm', {
                    selectLockedCells: true,
                    selectUnlockedCells: true,
                    formatColumns: true, // Izinkan user mengatur lebar kolom
                    formatRows: true     // Izinkan user mengatur tinggi baris jika dibutuhkan
                });

                // Mengekspor workbook menjadi format Buffer -> Blob
                const buffer = await workbook.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });

                // Men-trigger unduhan file ke perangkat pengguna
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = "Template Data Guru.xlsx";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

            } catch (e) {
                showAlert('Error', 'Gagal membuat file template excel.', 'error');
                console.error(e);
            }
        }

        function uploadTemplate(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (event) {
                try {
                    const data = new Uint8Array(event.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet, { raw: false });

                    let added = 0, updated = 0;
                    json.forEach(row => {
                        const nuptk = (row['NUPTK/PEG ID'] || '').toString().trim();
                        const nama = (row['Nama Guru'] || '').toString().trim();

                        if (nuptk && nama) {
                            const newGuru = {
                                nuptk: nuptk,
                                nama: nama,
                                tmLahir: (row['Tempat Lahir'] || '').toString().trim(),
                                tglLahir: (row['Tanggal Lahir (YYYY-MM-DD)'] || '').toString().trim(),
                                jabatan: (row['Jabatan'] || 'Guru').toString().trim(),
                                pendidikan: (row['Pendidikan'] || '').toString().trim(),
                                password: (row['Password'] || nuptk).toString().trim(),
                                foto: ''
                            };

                            const existingIndex = state.dataGuru.findIndex(g => g.nuptk === nuptk);
                            if (existingIndex >= 0) {
                                newGuru.foto = state.dataGuru[existingIndex].foto;
                                state.dataGuru[existingIndex] = newGuru;
                                updated++;
                            } else {
                                state.dataGuru.push(newGuru);
                                added++;
                            }
                        }
                    });
                    saveState();
                    addLog(`Upload massal: ${added} ditambahkan, ${updated} diperbarui`);
                    showAlert('Berhasil', `Data sukses diimpor ke Database. ${added} ditambahkan, ${updated} diperbarui.`, 'success').then(() => navigate('guru'));
                } catch (err) {
                    showAlert('Gagal', 'Terjadi kesalahan saat membaca file Excel. Pastikan format sesuai template.', 'error');
                    console.error(err);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function showFormGuru(existingData = null) {
            const isEdit = !!existingData;
            const title = isEdit ? 'Edit Data Guru' : 'Tambah Guru Baru';
            const g = existingData || { nuptk: '', nama: '', tmLahir: '', tglLahir: '', jabatan: '', pendidikan: '', password: '' };

            const passField = isEdit ?
                `<input type="hidden" id="fm-pass" value="${g.password}">` :
                `<div>

                pass += chars.charAt(Math.floor(Math.random() * chars.length));

            document.getElementById('fm-pass').value = pass;

        window.exportDataGuru = function () {
            try {
                if (state.dataGuru.length === 0) {
                    return showAlert('Informasi', 'Tidak ada data guru untuk diekspor.', 'info');
                }

                // Mapping data guru untuk menyesuaikan format kolom template Excel
                const exportData = state.dataGuru.map(g => {
                    return {
                        "NUPTK/PEG ID": "" + g.nuptk,
                        "Nama Guru": g.nama,
                        "Tempat Lahir": g.tmLahir || '-',
                        "Tanggal Lahir (YYYY-MM-DD)": g.tglLahir || '-',
                        "Jabatan": g.jabatan || '-',
                        "Pendidikan": g.pendidikan || '-',
                        "Password": g.password || '-'
                    };
                });

                // Buat Worksheet baru dari format JSON
                const ws = XLSX.utils.json_to_sheet(exportData);

                // Atur lebar kolom (width)
                ws['!cols'] = [{ wch: 25 }, { wch: 30 }, { wch: 18 }, { wch: 25 }, { wch: 25 }, { wch: 25 }, { wch: 20 }];

                // Atur tinggi baris (height = 18px)
                const totalRows = exportData.length + 1;
                ws['!rows'] = Array(totalRows).fill({ hpx: 18 });

                // Terapkan border dan styling untuk setiap sel (termasuk header baris pertama)
                for (let R = 0; R < totalRows; ++R) {
                    for (let C = 0; C < 7; ++C) {
                        const cellRef = XLSX.utils.encode_cell({ r: R, c: C });
                        if (!ws[cellRef]) ws[cellRef] = { t: 's', v: '' };
                        ws[cellRef].s = {
                            border: {
                                top: { style: "thin", color: { rgb: "000000" } },
                                bottom: { style: "thin", color: { rgb: "000000" } },
                                left: { style: "thin", color: { rgb: "000000" } },
                                right: { style: "thin", color: { rgb: "000000" } }
                            },
                            font: R === 0 ? { bold: true, color: { rgb: "000000" } } : {},
                            fill: { fgColor: { rgb: "FFFFFF" } },
                            alignment: { vertical: "center", horizontal: R === 0 ? "center" : "left" }
                        };
                    }
                }

                // Buat Workbook dan simpan menjadi file Excel
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Data Guru");
                XLSX.writeFile(wb, "Data Guru.xlsx");

            } catch (err) {
                showAlert('Error', 'Gagal mengekspor file Excel.', 'error');
                console.error(err);
            }
        };

        function loadTableRekap() {
            const fBulan = document.getElementById('filter-bulan').value;
            const fStatus = document.getElementById('filter-status').value;
            const tbody = document.getElementById('tbody-rekap');

            let data = state.rekapAbsen;
            if (fBulan) data = data.filter(d => d.date.startsWith(fBulan));
            if (fStatus !== 'semua') data = data.filter(d => d.status === fStatus);

            data.sort((a, b) => new Date(b.date + 'T' + (b.time !== '-' ? b.time : '00:00')) - new Date(a.date + 'T' + (a.time !== '-' ? a.time : '00:00')));

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-16 text-slate-400 font-semibold text-base">Tidak ada data rekam jejak pada kriteria filter ini.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(r => {
                const g = state.dataGuru.find(x => x.nuptk === r.nuptk);
                const gName = g ? g.nama : '<em class="text-rose-400 font-semibold">(Guru Dihapus)</em>';

                const dPart = r.date.split('-');
                const formattedDate = dPart.length === 3 ? `${dPart[2]}-${dPart[1]}-${dPart[0]}` : r.date;

                let badgeClass = 'bg-slate-100 text-slate-600 border border-slate-200';
                if (r.status === 'Hadir') badgeClass = 'bg-teal-50 text-teal-700 border border-teal-200';
                else if (r.status === 'Sakit') badgeClass = 'bg-amber-50 text-amber-700 border border-amber-200';
                else if (r.status === 'Izin') badgeClass = 'bg-sky-50 text-sky-700 border border-sky-200';
                else if (r.status === 'Alpa') badgeClass = 'bg-rose-50 text-rose-700 border border-rose-200';

                return `
                <tr class="border-b border-slate-100 hover:bg-slate-50/80 transition-colors">
                    <td class="py-3 px-3 text-center font-semibold border text-slate-700">${formattedDate}</td>
                    <td class="py-3 px-3 text-center font-semibold border text-slate-700">${r.nuptk}</td>
                    <td class="py-3 px-3 font-semibold border text-slate-800">${gName}</td>
                    <td class="py-3 px-3 text-center font-semibold border text-slate-700">${r.tunjangan || '-'}</td>
                    <td class="py-3 px-3 text-center font-semibold border"><span class="${badgeClass} py-1.5 px-3 rounded-full text-xs font-semibold shadow-sm inline-block min-w-[70px]">${r.status}</span></td>
                    <td class="py-3 px-3 text-center font-semibold border text-slate-700">${r.time}</td>
                    <td class="py-3 px-3 text-center font-semibold border text-slate-700 text-xs truncate max-w-xs" title="${r.note}">${r.note}</td>
                </tr>
                `;
            }).join('');
        }

        function exportRekap() {
            try {
                let dataRekap = state.rekapAbsen;
                const filterBulan = document.getElementById('filter-bulan').value;
                const filterStatus = document.getElementById('filter-status').value;

                // Filter untuk Sheet Detail Absensi
                if (filterBulan) dataRekap = dataRekap.filter(a => a.date.startsWith(filterBulan));
                if (filterStatus !== 'semua') dataRekap = dataRekap.filter(a => a.status === filterStatus);

                if (dataRekap.length === 0) return showAlert('Informasi', 'Tidak ada data untuk diekspor.', 'info');

                dataRekap.sort((a, b) => new Date(b.date) - new Date(a.date));

                // --- PROSES SHEET 1: DETAIL ABSENSI ---
                const exportData = dataRekap.map(r => {
                    const guru = state.dataGuru.find(t => t.nuptk === r.nuptk);
                    const dPart = r.date.split('-');
                    const formattedDate = dPart.length === 3 ? `${dPart[2]}-${dPart[1]}-${dPart[0]}` : r.date;

                    return {
                        "Tanggal": formattedDate,
                        "NUPTK/PEG ID": "'" + r.nuptk,
                        "Nama Guru": guru ? guru.nama : 'Data Dihapus',
                        "Jenis Tunjangan": r.tunjangan || '-',
                        "Status": r.status,
                        "Waktu": r.time || '-',
                        "Keterangan": r.note || '-'
                    };
                });

                const ws = XLSX.utils.json_to_sheet(exportData);
                ws['!cols'] = [{ wch: 12 }, { wch: 20 }, { wch: 30 }, { wch: 17 }, { wch: 12 }, { wch: 11 }, { wch: 22 }];
                const totalRows = exportData.length + 1;
                ws['!rows'] = Array(totalRows).fill({ hpx: 18 });

                for (let R = 0; R < totalRows; ++R) {
                    for (let C = 0; C <= 6; ++C) {
                        const cellRef = XLSX.utils.encode_cell({ r: R, c: C });
                        if (!ws[cellRef]) ws[cellRef] = { t: 's', v: '' };
                        ws[cellRef].s = {
                            border: {
                                top: { style: "thin", color: { rgb: "000000" } },
                                bottom: { style: "thin", color: { rgb: "000000" } },
                                left: { style: "thin", color: { rgb: "000000" } },
                                right: { style: "thin", color: { rgb: "000000" } }
                            },
                            font: R === 0 ? { bold: true, color: { rgb: "FFFFFF" } } : {},
                            // Tambahkan warna abu-abu pada baris pertama (R === 0)
                            fill: { fgColor: { rgb: R === 0 ? "FF0D9488" : "FFFFFF" } },
                            alignment: { vertical: "center", horizontal: R === 0 ? "center" : "left" },
                            // Kunci (protect) baris pertama, biarkan baris data (R > 0) terbuka
                            protection: { locked: R === 0 }
                        };
                    }
                }
                ws['!ref'] = `A1:G${totalRows}`;

                // Aktifkan proteksi sheet 1 dengan password (misal: "admin")
                ws['!protect'] = { password: "admin", selectLockedCells: true, selectUnlockedCells: true };


                // --- PROSES SHEET 2: REKAP BULANAN (Sakit, Izin, Alpa) ---
                let dataSummary = state.rekapAbsen;
                // Hanya gunakan filter bulan (tanpa filter status, agar hitungannya akurat)
                if (filterBulan) dataSummary = dataSummary.filter(a => a.date.startsWith(filterBulan));

                let summaryMap = {};
                dataSummary.forEach(r => {
                    const month = r.date.substring(0, 7); // Format: YYYY-MM
                    const key = `${r.nuptk}_${month}`;

                    if (!summaryMap[key]) {
                        const guru = state.dataGuru.find(t => t.nuptk === r.nuptk);
                        summaryMap[key] = {
                            "Bulan": month,
                            "NUPTK/PEG ID": "'" + r.nuptk,
                            "Nama Guru": guru ? guru.nama : 'Data Dihapus',
                            "Hadir": 0,
                            "Sakit": 0,
                            "Izin": 0,
                            "Alpa": 0
                        };
                    }

                    if (r.status === 'Hadir') summaryMap[key]["Hadir"]++;
                    else if (r.status === 'Sakit') summaryMap[key]["Sakit"]++;
                    else if (r.status === 'Izin') summaryMap[key]["Izin"]++;
                    else if (r.status === 'Alpa') summaryMap[key]["Alpa"]++;
                });

                const summaryArray = Object.values(summaryMap);
                let wsSummary = null;

                if (summaryArray.length > 0) {
                    wsSummary = XLSX.utils.json_to_sheet(summaryArray);
                    wsSummary['!cols'] = [{ wch: 12 }, { wch: 20 }, { wch: 30 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 10 }];
                    const totalRowsSum = summaryArray.length + 1;
                    wsSummary['!rows'] = Array(totalRowsSum).fill({ hpx: 18 });

                    for (let R = 0; R < totalRowsSum; ++R) {
                        for (let C = 0; C <= 6; ++C) {
                            const cellRef = XLSX.utils.encode_cell({ r: R, c: C });
                            if (!wsSummary[cellRef]) wsSummary[cellRef] = { t: 's', v: '' };
                            wsSummary[cellRef].s = {
                                border: {
                                    top: { style: "thin", color: { rgb: "000000" } },
                                    bottom: { style: "thin", color: { rgb: "000000" } },
                                    left: { style: "thin", color: { rgb: "000000" } },
                                    right: { style: "thin", color: { rgb: "000000" } }
                                },
                                font: R === 0 ? { bold: true, color: { rgb: "FFFFFF" } } : {},
                                // Warna biru muda untuk header di sheet rekap bulanan
                                fill: { fgColor: { rgb: R === 0 ? "FF0D9488" : "FFFFFF" } },
                                alignment: { vertical: "center", horizontal: R === 0 || C >= 3 ? "center" : "left" },
                                protection: { locked: R === 0 }
                            };
                        }
                    }
                    wsSummary['!protect'] = { password: "admin", selectLockedCells: true, selectUnlockedCells: true };
                }

                // --- PEMBUATAN WORKBOOK ---
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Detail Absensi");

                // Tambahkan sheet Rekap Bulanan jika ada datanya
                if (wsSummary) {
                    XLSX.utils.book_append_sheet(wb, wsSummary, "Jumlah Bulanan");
                }

                const fileName = `Rekap Absensi ${filterBulan || 'Semua'}.xlsx`;
                XLSX.writeFile(wb, fileName);

            } catch (err) {

            }).then(res => {

                    const fStatus = document.getElementById('filter-status').value;

                    let dataToKeep = state.rekapAbsen;

                        dataToKeep = [];

                    state.rekapAbsen = dataToKeep;
                    saveState();
                    addLog(`Menghapus data absensi massal (Filter: ${fBulan || 'Semua'})`);

                                <option value="D3 (Diploma)" ${g.pendidikan === 'D3 (Diploma)' ? 'selected' : ''}>D3 (Diploma)</option>
                                <option value="D4 (Diploma) / S1 (Sarjana)" ${g.pendidikan === 'D4 (Diploma) / S1 (Sarjana)' ? 'selected' : ''}>D4 (Diploma) / S1 (Sarjana)</option>
                                <option value="S2 (Magister)" ${g.pendidikan === 'S2 (Magister)' ? 'selected' : ''}>S2 (Magister)</option>
                                <option value="S3 (Doktor)" ${g.pendidikan === 'S3 (Doktor)' ? 'selected' : ''}>S3 (Doktor)</option>
                            </select>
                        </div>
                        <div class="relative">
                            <label class="block text-sm font-bold text-slate-700 tracking-wider mb-1.5">Ubah Sandi</label>
                            <input type="password" id="eb-pass" value="${g.password}" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none transition-all text-sm text-slate-600 font-bold pr-10">
                            <button onclick="togglePass('eb-pass')" class="absolute bottom-3 right-3 text-slate-400 hover:text-slate-600"><i class="fas fa-eye"></i></button>
                        </div>
                        <input type="hidden" id="eb-foto" value="${g.foto}">
                    </div>
                `,
                showCancelButton: true,
                confirmButtonColor: '#0d9488',
                confirmButtonText: 'Simpan Profil',
                cancelButtonText: 'Batal',
                customClass: { popup: 'rounded-xl pb-4', confirmButton: 'rounded-lg px-6 font-bold shadow-md', cancelButton: 'rounded-lg px-6 font-bold', title: 'text-2xl font-bold' },
                preConfirm: () => {
                    const nama = document.getElementById('eb-nama').value.trim();
                    if (!nama) return Swal.showValidationMessage('Nama lengkap wajib diisi');
                    return {
                        nama,
                        tmLahir: document.getElementById('eb-tmlahir').value,
                        tglLahir: document.getElementById('eb-tgllahir').value,
                        pendidikan: document.getElementById('eb-pendidikan').value || '',
                        password: document.getElementById('eb-pass').value || g.password,
                        foto: document.getElementById('eb-foto').value
                    };
                }
            }).then(res => {
                if (res.isConfirmed) {
                    const idx = state.dataGuru.findIndex(x => x.nuptk === state.currentUser.id);
                    state.dataGuru[idx] = { ...state.dataGuru[idx], ...res.value };
                    state.currentUser.name = res.value.nama;
                    saveState();
                    Swal.fire({ icon: 'success', title: 'Profil Diperbarui', toast: true, position: 'top-end', timer: 2000, showConfirmButton: false }).then(() => renderLayout());
                }
            });
        }

        window.previewEditFoto = function (e) {
            const file = e.target.files[0];
            if (file) {
                if (file.size > 512000) {
                    showAlert('Gagal Unggah', 'Ukuran foto profil maksimal 500 KB.', 'error');
                    e.target.value = ''; // Reset input file
                    return;
                }

                compressImage(file, 400, (compressedBase64) => {
                    document.getElementById('edit-prev-foto').src = compressedBase64;
                    document.getElementById('eb-foto').value = compressedBase64;
                });
            }
        };

        window.hapusFotoEdit = function () {
            document.getElementById('edit-prev-foto').src = 'https://placehold.co/100x100/f1f5f9/94a3b8?text=Foto';
            document.getElementById('eb-foto').value = '';
        };

        function renderAbsenUI(container) {
            const renderDate = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Jakarta' });

            const nuptk = state.currentUser.id;
            const now = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Jakarta" }));
            const todayStr = renderDate;

            const pMulai = state.pengaturan.waktuMulai;
            const pAkhir = state.pengaturan.batasAkhir;

            const splitMulai = pMulai.split(':');
            const splitAkhir = pAkhir.split(':');
            const dMulai = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parseInt(splitMulai[0]), parseInt(splitMulai[1]), 0);
            const dAkhir = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parseInt(splitAkhir[0]), parseInt(splitAkhir[1]), 0);

            const isLate = now > dAkhir;
            const isTooEarly = now < dMulai;
            const liburStatus = isLibur(now);

            let statusMsg = `<span class="text-emerald-600 font-extrabold flex items-center gap-1.5"><i class="fas fa-door-open"></i> Dibuka</span>`;
            let lockTerminal = false;
            let keterangan = 'Silakan pilih Jenis Tunjangan lalu tentukan status kehadiran Anda.';

            if (liburStatus) {
                lockTerminal = true;
                statusMsg = `<span class="text-rose-500 font-extrabold flex items-center gap-1.5"><i class="fas fa-lock"></i> Ditutup</span>`;
                keterangan = `<div class="bg-rose-50 border border-rose-100 p-3 text-xl font-semibold rounded-xl inline-block text-rose-700">Maaf, Anda tidak bisa merekam absen karena hari ini libur : <strong>${liburStatus}</strong>.</div>`;
            } else if (isTooEarly) {
                lockTerminal = true;
                statusMsg = `<span class="text-amber-500 font-extrabold flex items-center gap-1.5"><i class="fas fa-clock"></i> Belum Buka</span>`;
                keterangan = `<div class="text-slate-800 text-2xl">Sistem absensi akan dibuka pada pukul <strong class="text-slate-800 text-2xl">${pMulai} WIB</strong>.</div>`;
            } else if (isLate) {
                lockTerminal = true;
                statusMsg = `<span class="text-rose-500 font-extrabold flex items-center gap-1.5"><i class="fas fa-lock"></i> Sesi Berakhir</span>`;
                keterangan = `<div class="text-slate-800 text-2xl">Waktu absen hari ini (<strong class="text-slate-800 text-2xl">${pAkhir} WIB</strong>) telah berakhir.</div>`;
            }

            const existingAbsen = state.rekapAbsen.find(r => r.nuptk === nuptk && r.date === todayStr);
            let displayAbsen = '';
            if (existingAbsen) {
                lockTerminal = true;
                statusMsg = `<span class="text-slate-500 font-extrabold flex items-center gap-1.5"><i class="fas fa-check-double"></i> Selesai</span>`;
                keterangan = 'Kehadiran Anda hari ini telah tersimpan di sistem.';

                let bCls = 'bg-slate-100 text-slate-600 border-slate-200';
                if (existingAbsen.status === 'Hadir') bCls = 'bg-teal-50 text-teal-600 border-teal-200 shadow-[0_0_15px_rgba(20,184,166,0.15)]';
                else if (existingAbsen.status === 'Sakit') bCls = 'bg-amber-50 text-amber-600 border-amber-200 shadow-[0_0_15px_rgba(245,158,11,0.15)]';
                else if (existingAbsen.status === 'Izin') bCls = 'bg-sky-50 text-sky-600 border-sky-200 shadow-[0_0_15px_rgba(14,165,233,0.15)]';
                else if (existingAbsen.status === 'Alpa') bCls = 'bg-rose-50 text-rose-600 border-rose-200 shadow-[0_0_15px_rgba(225,29,72,0.15)]';

                displayAbsen = `
                    <div class="mt-4 p-6 bg-slate-50/80 border border-slate-200 rounded-xl text-center fade-in w-full max-w-sm mx-auto backdrop-blur-sm relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-1 ${bCls.split(' ')[0].replace('50', '400')}"></div>
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Status Terekam</p>
                        <div class="text-4xl font-black mb-4"><span class="${bCls} px-8 py-2.5 rounded-lg inline-block border-2 tracking-wide">${existingAbsen.status}</span></div>
                        <div class="bg-white p-3 rounded-lg border border-slate-100 shadow-sm text-left">
                            <div class="flex justify-between items-center mb-1.5">
                                <span class="text-xs font-bold text-slate-400">Tunjangan</span>
                                <span class="text-sm font-extrabold text-slate-700">${existingAbsen.tunjangan || '-'}</span>
                            </div>
                            <div class="flex justify-between items-center mb-1.5">
                                <span class="text-xs font-bold text-slate-400">Jam Masuk</span>
                                <span class="text-sm font-extrabold text-slate-700">${existingAbsen.time} WIB</span>
                            </div>
                            <div class="flex justify-between items-start">
                                <span class="text-xs font-bold text-slate-400">Catatan</span>
                                <span class="text-sm font-bold text-slate-600 text-right line-clamp-2 ml-4">${existingAbsen.note}</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            let pengHtml = state.pengumuman.slice(0, 3).map(p => `
                <div class="p-4 border-l-4 border-brand-500 bg-slate-50/50 hover:bg-slate-50 transition-colors shadow-sm mb-3 rounded-r-xl border-y border-r border-slate-100">
                    <h5 class="font-bold text-slate-800 text-sm mb-1">${p.judul}</h5>
                    <p class="text-[10px] font-bold text-brand-600 mb-2 uppercase tracking-wide"><i class="far fa-clock"></i> ${p.date}</p>
                    <p class="text-xs text-slate-600 whitespace-pre-line leading-relaxed font-medium">${p.isi}</p>
                </div>
            `).join('') || '<div class="text-center py-6 text-slate-400"><i class="far fa-smile-wink text-2xl mb-2 block"></i><span class="text-sm font-medium">Belum ada info baru.</span></div>';

            const upcomingHolidays = liburNasional.filter(l => l.date >= todayStr).slice(0, 4);
            let liburHtml = upcomingHolidays.map(l => {
                const d = new Date(l.date);
                const tgl = d.getDate();
                const bln = d.toLocaleString('id-ID', { month: 'short' });
                return `
                    <div class="flex items-center gap-4 p-2 rounded-lg hover:bg-slate-50 transition-colors">
                        <div class="bg-rose-100 text-rose-600 rounded-lg py-2 px-1 text-center w-14 border border-rose-100 shadow-sm shrink-0 flex flex-col justify-center">
                            <div class="text-xl font-black leading-none">${tgl}</div>
                            <div class="text-[12px] font-extrabold uppercase">${bln}</div>
                        </div>
                        <div class="flex-1">
                            <p class="text-sm font-bold text-slate-700 leading-tight">${l.name}</p>
                        </div>
                    </div>
                `;
            }).join('') || '<p class="text-sm text-slate-400 italic text-center py-2">Tidak ada libur dalam waktu dekat.</p>';

            container.innerHTML = `
                <div class="fade-in max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-7 gap-8">
                    <div class="lg:col-span-4">
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden h-full flex flex-col relative">
                            <div class="bg-slate-800 p-5 border-b border-slate-700 text-center z-10 relative overflow-hidden shadow-inner">
                                <div class="absolute inset-0 bg-brand-600 opacity-20 pattern-diagonal-lines"></div>
                                <p class="text-lg text-brand-200 font-bold mb-1 relative z-10 tracking-widest" id="realtime-date">Memuat Tanggal...</p>
                                <p class="text-3xl text-white font-black tracking-widest relative z-10" id="realtime-clock">--:--:-- WIB</p>
                            </div>
                            <div class="bg-slate-50 px-8 py-5 border-b border-slate-200 flex justify-between items-center z-10">
                                <div class="flex items-center gap-3">
                                    <div class="p-2 bg-brand-100 rounded-lg text-brand-600"><i class="fas fa-fingerprint text-lg"></i></div>
                                    <h2 class="text-xl font-extrabold text-slate-800">Terminal Kehadiran</h2>
                                </div>
                                <div class="text-xs bg-white py-1.5 px-4 border border-slate-200 rounded-full shadow-sm uppercase tracking-wider">${statusMsg}</div>
                            </div>
                            
                            <div class="p-8 flex-1 flex flex-col justify-center items-center relative overflow-hidden">
                                <div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(#0d9488 2px, transparent 2px); background-size: 30px 30px;"></div>
                                
                                <div class="text-center mb-8 relative z-10">
                                    <p class="text-slate-500 font-medium">${keterangan}</p>
                                </div>
                                
                                ${!lockTerminal ? `
                                    <div class="w-full max-w-sm mb-8 fade-in relative z-10 bg-slate-50 p-5 rounded-xl border border-slate-100 shadow-sm">
                                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 text-center">Langkah 1: Pilih Jenis Tunjangan</label>
                                        <div class="relative">
                                            <select id="input-tunjangan" class="w-full p-4 bg-white border-2 border-brand-200 rounded-lg focus:border-brand-500 focus:ring-4 focus:ring-brand-50 outline-none text-brand-700 font-extrabold cursor-pointer appearance-none text-center shadow-sm transition-all text-lg">
                                                <option value="" disabled selected>-- Pilih --</option>
                                                <option value="Inpassing">Inpassing</option>
                                                <option value="Sertifikasi">Sertifikasi</option>
                                                <option value="Non Tunjangan">Non Tunjangan</option>
                                            </select>
                                            <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-brand-500"><i class="fas fa-chevron-down"></i></div>
                                        </div>
                                    </div>

                                    <div class="w-full max-w-sm fade-in relative z-10">
                                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 text-center">Langkah 2: Rekam Kehadiran</label>
                                        <div class="grid grid-cols-3 gap-3">
                                            <button onclick="submitAbsen('Hadir')" class="flex flex-col items-center justify-center p-5 bg-teal-50 hover:bg-teal-500 hover:text-white text-teal-700 rounded-xl border-2 border-teal-200 transition-all shadow-sm group">
                                                <i class="fas fa-street-view text-3xl mb-3 group-hover:scale-125 group-hover:-translate-y-1 transition-transform duration-300"></i>
                                                <span class="font-extrabold text-sm uppercase tracking-wide">Hadir</span>
                                            </button>
                                            <button onclick="submitAbsen('Sakit')" class="flex flex-col items-center justify-center p-5 bg-amber-50 hover:bg-amber-500 hover:text-white text-amber-700 rounded-xl border-2 border-amber-200 transition-all shadow-sm group">
                                                <i class="fas fa-briefcase-medical text-3xl mb-3 group-hover:scale-125 group-hover:-translate-y-1 transition-transform duration-300"></i>
                                                <span class="font-extrabold text-sm uppercase tracking-wide">Sakit</span>
                                            </button>
                                            <button onclick="submitAbsen('Izin')" class="flex flex-col items-center justify-center p-5 bg-sky-50 hover:bg-sky-500 hover:text-white text-sky-700 rounded-xl border-2 border-sky-200 transition-all shadow-sm group">
                                                <i class="fas fa-envelope-open-text text-3xl mb-3 group-hover:scale-125 group-hover:-translate-y-1 transition-transform duration-300"></i>
                                                <span class="font-extrabold text-sm uppercase tracking-wide">Izin</span>
                                            </button>
                                        </div>
                                    </div>
                                ` : ''}

                                ${displayAbsen}
                            </div>
                        </div>
                    </div>

                    <div class="lg:col-span-3 space-y-6">
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col max-h-[350px]">
                            <div class="bg-brand-100 px-5 py-4 border-b border-slate-200 flex items-center gap-3">
                                <div class="p-1.5 bg-brand-100 rounded-md text-brand-600"><i class="fas fa-bullhorn text-sm"></i></div>
                                <h3 class="font-extrabold text-slate-800">Papan Informasi</h3>
                            </div>
                            <div class="p-5 flex-1 overflow-y-auto custom-scrollbar">
                                ${pengHtml}
                            </div>
                        </div>
                        
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <div class="bg-rose-500 px-5 py-4 border-b border-rose-600 text-white flex items-center gap-3">
                                <div class="p-1.5 bg-rose-600 rounded-md text-white"><i class="fas fa-calendar-times text-sm"></i></div>
                                <h3 class="font-extrabold">Jadwal Libur</h3>
                            </div>
                            <div class="p-5">
                                <div class="mb-5 pb-5 border-b border-slate-100">
                                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 flex items-start gap-3">
                                        <i class="fas fa-info-circle text-rose-500 mt-0.5 text-lg"></i>
                                        <p class="text-xs text-slate-600 leading-relaxed font-medium">Sistem terminal otomatis ditutup total setiap <strong>Hari Minggu</strong> dan <strong>Hari Libur Nasional</strong>.</p>
                                    </div>
                                </div>
                                <div>
                                    <h4 class="text-[10px] font-black text-slate-400 mb-3 uppercase tracking-widest">Hari Libur Terdekat</h4>
                                    <div class="space-y-1">
                                        ${liburHtml}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            if (window.clockInterval) clearInterval(window.clockInterval);
            window.clockInterval = setInterval(() => {
                const clockEl = document.getElementById('realtime-clock');
                const dateEl = document.getElementById('realtime-date');

                if (clockEl && dateEl) {
                    const nowWIB = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Jakarta" }));

                    const jam = String(nowWIB.getHours()).padStart(2, '0');
                    const menit = String(nowWIB.getMinutes()).padStart(2, '0');
                    const detik = String(nowWIB.getSeconds()).padStart(2, '0');
                    clockEl.innerText = `${jam}:${menit}:${detik} WIB`;

                    const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                    dateEl.innerText = nowWIB.toLocaleDateString('id-ID', dateOptions);

                    const currentDate = nowWIB.toLocaleDateString('en-CA', { timeZone: 'Asia/Jakarta' });
                    if (currentDate !== renderDate) {
                        clearInterval(window.clockInterval);
                        checkAutoAlpa();
                        renderAbsenUI(container);
                    }
                }
            }, 1000);
        }

        window.submitAbsen = function (status) {
            const tunjangan = document.getElementById('input-tunjangan').value;
            if (!tunjangan) {
                const s = document.getElementById('input-tunjangan');
                s.classList.add('ring-4', 'ring-rose-200', 'border-rose-400', 'text-rose-600');
                setTimeout(() => s.classList.remove('ring-4', 'ring-rose-200', 'border-rose-400', 'text-rose-600'), 1500);
                return showAlert('Tunjangan Belum Dipilih', 'Silakan pilih Jenis Tunjangan Anda terlebih dahulu pada Langkah 1.', 'warning');
            }

            if (status === 'Hadir') {
                finalizeAbsen(status, tunjangan, 'Tepat Waktu');
            } else {
                Swal.fire({
                    title: `Keterangan ${status}`,
                    input: 'textarea',
                    inputLabel: 'Tuliskan alasan/keterangan secara singkat',
                    inputPlaceholder: 'Misal: Sakit demam, atau ada acara keluarga...',
                    showCancelButton: true,
                    confirmButtonText: 'Kirim',
                    cancelButtonText: 'Batal',
                    confirmButtonColor: '#0d9488',
                    customClass: { popup: 'rounded-xl', confirmButton: 'rounded-lg px-6', cancelButton: 'rounded-lg px-6' },
                    inputValidator: (value) => {
                        if (!value) return 'Keterangan tidak boleh kosong untuk izin/sakit!';
                    }
                }).then((res) => {
                    if (res.isConfirmed) {
                        finalizeAbsen(status, tunjangan, res.value);
                    }
                });
            }
        };

        function finalizeAbsen(status, tunjangan, note) {
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

            state.rekapAbsen.push({
                id: Date.now().toString(),
                nuptk: state.currentUser.id,
                date: dateStr,
                time: timeStr,
                status: status,
                tunjangan: tunjangan,
                note: note
            });

            saveState();
            Swal.fire({
                title: 'Sukses!',
                text: `Status ${status} Anda berhasil terekam.`,
                icon: 'success',
                confirmButtonColor: '#0d9488',
                customClass: { popup: 'rounded-xl', confirmButton: 'rounded-lg px-8 font-bold' }
            }).then(() => renderAbsenUI(document.getElementById('main-content')));
        }

        window.initApp = async function () {
            document.getElementById('app-container').innerHTML = `
                <div class="w-full min-h-screen flex flex-col items-center justify-center bg-slate-50">
                    <i class="fas fa-cloud-download-alt text-5xl text-brand-500 mb-4 animate-bounce"></i>
                    <h2 class="text-xl font-bold text-slate-700">Menyinkronkan Database...</h2>
                    <p class="text-slate-500 text-sm">Menghubungkan ke Cloud Storage</p>
                </div>
            `;

            await loadState();
            if (state.currentUser) {
                checkAutoAlpa();
                renderLayout();
            } else {
                renderLogin();
            }
        }

        window.toggleHeaderMenu = function () {
            const dropdown = document.getElementById('header-dropdown');
            if (dropdown) dropdown.classList.toggle('hidden');
        };

        document.addEventListener('click', function (event) {
            const dropdown = document.getElementById('header-dropdown');
            if (dropdown && !dropdown.classList.contains('hidden')) {
                const button = event.target.closest('button[onclick="toggleHeaderMenu()"]');
                if (!button) dropdown.classList.add('hidden');
            }
        });

    </script>
</body>

</html>
